<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桨板教材图片预览</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
  h1 { color: #333; }
  .tip { background: #fff3cd; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: white; border-radius: 8px; padding: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .card img { width: 100%; height: 200px; object-fit: contain; background: #fafafa; }
  .card .label { text-align: center; font-weight: bold; margin-top: 8px; color: #0066cc; font-size: 18px; }
  .missing { display: none; }
</style>
</head>
<body>
<h1>桨板教材图片预览</h1>
<div class="tip">
  对照 Word 教材，逐个记录每张图对应教材里的图号（如 图2-1、图2-3）。<br>
  如果顺序基本跟教材一致，只需要告诉我顺序规律即可；如果有跳号，单独指出。
</div>
<div class="grid" id="grid"></div>
<script>
const grid = document.getElementById('grid');
for (let i = 1; i <= 200; i++) {
  const num = String(i).padStart(3, '0');
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<img src="/images/raw/img' + num + '.png" onerror="this.parentElement.classList.add(\'missing\')" alt="img' + num + '"><div class="label">img' + num + '</div>';
  grid.appendChild(card);
}
</script>
</body>
</html>
